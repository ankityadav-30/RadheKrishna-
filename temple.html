<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Virtual Darshan | Divine Aarti</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --gold: #ffd700;
            --radha-pink: #d81b60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        html, body {
            background-color: #000;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed; /* Completely locks scrolling on mobile iOS/Android */
            font-family: 'Cinzel Decorative', cursive;
            user-select: none;
            touch-action: none;
        }

        /* ---------------------------------
           MORPANKH TRANSITION
           --------------------------------- */
        #morpankh-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }

        .morpankh-svg {
            width: 150px;
            height: 150px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 128, 0.5));
            animation: morpankhSweep 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transform-origin: center bottom;
        }

        @keyframes morpankhSweep {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            40% { transform: scale(1.5) rotate(0deg); opacity: 1; }
            60% { transform: scale(1.5) rotate(0deg); opacity: 1; }
            100% { transform: scale(50) rotate(45deg); opacity: 0; }
        }

        .om-chant {
            position: absolute;
            color: var(--gold);
            font-size: 3rem;
            opacity: 0;
            animation: omFade 4s ease forwards;
        }

        @keyframes omFade {
            0% { opacity: 0; transform: translateY(20px); }
            30% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* ---------------------------------
           VIDEO & UI
           --------------------------------- */
        .video-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center; /* Center focus on mobile */
            opacity: 0.9;
        }
        
        .video-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 2;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1.5rem;
            z-index: 101;
            transition: 0.3s;
        }
        .back-btn:hover { color: var(--gold); transform: translateX(-5px); }

        .instruction {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Great Vibes', cursive;
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Aarti Flame cursor */
        .flame-cursor {
            position: absolute;
            font-size: 2.5rem;
            color: #ffaa00;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 100;
            filter: drop-shadow(0 0 15px rgba(255, 170, 0, 0.9)) drop-shadow(0 0 40px #ff5500);
            mix-blend-mode: screen;
            animation: flicker 0.15s infinite alternate;
        }
        
        /* Dynamic Light Aura following flame */
        .flame-aura {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,150,50,0.3) 0%, rgba(255,100,0,0.1) 30%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 3;
            mix-blend-mode: overlay;
        }

        @keyframes flicker {
            0% { opacity: 0.85; transform: translate(-50%, -50%) scale(0.95) rotate(-2deg); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(2deg); filter: drop-shadow(0 0 25px #ffaa00) drop-shadow(0 0 50px #ff5500); }
        }

        /* Puja Thali */
        .puja-thali {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(15px);
            z-index: 101;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .thali-btn {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: var(--gold);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }
        .thali-btn:hover, .thali-btn.active {
            background: rgba(255, 215, 0, 0.25);
            transform: translateY(-8px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.5);
        }

        /* Tooltip */
        .thali-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 120%; left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .thali-btn:hover::after { transform: translateX(-50%) scale(1); opacity: 1; }

        /* Flower Particle */
        .flower {
            position: absolute;
            pointer-events: none;
            font-size: 2rem;
            animation: fall 3s forwards ease-in;
            z-index: 15;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(0) rotate(20deg) scale(1.2); }
            100% { transform: translateY(100vh) rotate(180deg) scale(0.8); opacity: 0; }
        }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .puja-thali {
                bottom: 15px;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                width: 90%;
            }
            .thali-btn { width: 45px; height: 45px; font-size: 1.2rem; }
            .instruction { font-size: 1rem; padding: 0 10px; }
            .back-btn { font-size: 2rem; top: 15px; left: 15px; }
        }
        
        .video-placeholder {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.4);
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 0;
        }
        .video-placeholder i { font-size: 3rem; margin-bottom: 10px; color: rgba(255, 215, 0, 0.4); }

    </style>
</head>
<body>

    <!-- Morpankh Transition Overlay -->
    <div id="morpankh-overlay">
        <div class="om-chant">ॐ</div>
        <!-- SVG Peacock Feather Curve -->
        <svg class="morpankh-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 95 C 40 80, 20 60, 20 35 C 20 15, 35 5, 50 5 C 65 5, 80 15, 80 35 C 80 60, 60 80, 50 95 Z" fill="url(#pankhGrad)"/>
            <circle cx="50" cy="35" r="15" fill="#004d40"/>
            <circle cx="50" cy="35" r="8" fill="#ffb300"/>
            <circle cx="50" cy="35" r="4" fill="#00e5ff"/>
            <defs>
                <linearGradient id="pankhGrad" x1="50" y1="5" x2="50" y2="95" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#00e5ff"/>
                    <stop offset="0.5" stop-color="#00c853"/>
                    <stop offset="1" stop-color="#004d40"/>
                </linearGradient>
            </defs>
        </svg>
    </div>

    <!-- UI Elements -->
    <a href="index.html" class="back-btn" title="Back to Home"><i class="ri-arrow-left-line"></i></a>
    
    <div class="instruction">
        Touch or Move to perform Aarti
    </div>

    <!-- Cinematic Video Container -->
    <div class="video-container">
        <!-- Placeholder text when video is missing -->
        <div class="video-placeholder">
            <i class="ri-film-line"></i>
            <p>Please place your AI-generated cinematic video<br>here and name it <strong>darshan-video.mp4</strong></p>
        </div>
        
        <!-- The actual video element -->
        <video id="darshanVideo" loop muted playsinline autoplay>
            <!-- USER MUST PROVIDE THIS FILE -->
            <source src="darshan-video.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>
    
    <!-- Dynamic Light Aura & Flame Cursor -->
    <div class="flame-aura" id="flameAura"></div>
    <div class="flame-cursor" id="flameIcon"><i class="ri-fire-fill"></i></div>

    <!-- Puja Thali -->
    <div class="puja-thali" id="thali">
        <button class="thali-btn" id="btnBell" data-tooltip="Ring Bell">🔔</button>
        <button class="thali-btn" id="btnOm" data-tooltip="Chant Om">🕉️</button>
        <button class="thali-btn" id="btnFlower" data-tooltip="Offer Flowers">🌸</button>
        <button class="thali-btn" id="btnConch" data-tooltip="Blow Shankh">🐚</button>
        <button class="thali-btn" id="btnAuto" data-tooltip="Auto Aarti">🔄</button>
    </div>

    <!-- Scripts -->
    <script>
        // --- 1. MORPANKH TRANSITION & VIDEO PLAY ---
        window.addEventListener('load', () => {
            const video = document.getElementById('darshanVideo');
            
            // Try to play the video (browsers require interaction for audio, but it's muted so it should autoplay)
            video.play().catch(e => console.log("Video not found or autoplay prevented:", e));

            setTimeout(() => {
                const overlay = document.getElementById('morpankh-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 2000); // Remove from DOM after fade
            }, 3000);
        });

        // --- 2. AUDIO SETUP ---
        const bellAudio = new Audio('bell.mp3');
        const sankhAudio = new Audio('sankh.mp3');
        const omAudio = new Audio('om.mp3'); 
        const aartiAudio = new Audio('aarti.mp3'); 
        aartiAudio.loop = true;

        // --- 3. AARTI FLAME DYNAMICS ---
        const flameIcon = document.getElementById('flameIcon');
        const flameAura = document.getElementById('flameAura');
        let isAutoAarti = false;
        let autoAartiAngle = 0;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        function updatePointer(x, y) {
            mouseX = x;
            mouseY = y;
            if (!isAutoAarti) {
                flameIcon.style.left = x + 'px';
                flameIcon.style.top = y + 'px';
                flameAura.style.left = x + 'px';
                flameAura.style.top = y + 'px';
            }
        }

        window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            // e.preventDefault(); // allow scrolling if needed, but we have overflow: hidden
            updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // Auto Aarti Loop
        function animateAarti() {
            if (isAutoAarti) {
                autoAartiAngle += 0.04; // Speed of rotation
                
                // Elliptical orbit calculation (Lissajous curve)
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                // Creates a beautiful figure-8 or circular sweeping motion
                // Bound the radius so it never forces mobile screens to overflow
                const radiusX = Math.min(window.innerWidth * 0.25, 120);
                const radiusY = Math.min(window.innerHeight * 0.15, 80);
                const aX = centerX + Math.sin(autoAartiAngle) * radiusX;
                const aY = centerY + Math.cos(autoAartiAngle * 2) * radiusY + 50;
                
                flameIcon.style.left = aX + 'px';
                flameIcon.style.top = aY + 'px';
                flameAura.style.left = aX + 'px';
                flameAura.style.top = aY + 'px';
            }
            requestAnimationFrame(animateAarti);
        }
        animateAarti(); // Start animation loop

        // --- 4. THALI INTERACTIONS ---
        document.getElementById('btnBell').addEventListener('click', () => {
            bellAudio.currentTime = 0;
            bellAudio.play();
        });

        document.getElementById('btnOm').addEventListener('click', () => {
            omAudio.currentTime = 0;
            omAudio.play();
        });

        document.getElementById('btnConch').addEventListener('click', () => {
            sankhAudio.currentTime = 0;
            sankhAudio.play();
        });

        document.getElementById('btnFlower').addEventListener('click', () => {
            for(let i=0; i<20; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.classList.add('flower');
                    const flowers = ['🌸', '🌺', '🌹', '🌼', '✨'];
                    flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                    flower.style.left = Math.random() * window.innerWidth + 'px';
                    document.body.appendChild(flower);
                    
                    // Clean up after animation
                    setTimeout(() => flower.remove(), 3000);
                }, i * 150); // Staggered falling effect
            }
        });

        const btnAuto = document.getElementById('btnAuto');
        btnAuto.addEventListener('click', () => {
            isAutoAarti = !isAutoAarti;
            if (isAutoAarti) {
                btnAuto.classList.add('active');
                aartiAudio.play();
                autoAartiAngle = 0;
            } else {
                btnAuto.classList.remove('active');
                aartiAudio.pause();
                // Return flame to cursor smoothly
                flameIcon.style.left = mouseX + 'px';
                flameIcon.style.top = mouseY + 'px';
                flameAura.style.left = mouseX + 'px';
                flameAura.style.top = mouseY + 'px';
            }
        });

    </script>
</body>
</html>
